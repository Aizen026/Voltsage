name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"

    steps:
      - name: Checkout Code with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history and all existing tags

      - name: Determine Next Version
        id: version_calc
        run: |
          # Ensure remote tags are fetched
          git fetch --tags --force 2>/dev/null || true

          # Find the latest release tag (e.g. v1.0, v1.1) sorted by version
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag -l "[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          fi

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.0"
            NEW_TAG="v1.0"
            VERSION_CODE=1000
          else
            # Strip leading 'v'
            CLEAN_VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VERSION" | cut -d. -f2 | cut -d- -f1)

            # Fallback if parsing fails
            if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then MAJOR=1; fi
            if ! [[ "$MINOR" =~ ^[0-9]+$ ]]; then MINOR=0; fi

            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="${MAJOR}.${NEW_MINOR}"
            NEW_TAG="v${NEW_VERSION}"
            VERSION_CODE=$((MAJOR * 1000 + NEW_MINOR))
          fi

          echo "Latest tag: ${LATEST_TAG:-none}"
          echo "Target version: ${NEW_VERSION} (${NEW_TAG})"
          echo "Target version code: ${VERSION_CODE}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          chmod +x ./scripts/restore_keystore.sh
          ./scripts/restore_keystore.sh

          echo "Active signing certificate fingerprint:"
          keytool -list -keystore debug.keystore -storepass android | grep "Certificate fingerprint" || true

          # Prepare .env from example or create default
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure GEMINI_API_KEY exists in .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          elif ! grep -q "GEMINI_API_KEY=" .env; then
            echo "GEMINI_API_KEY=" >> .env
          fi

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ steps.version_calc.outputs.version_code }} -PversionName=${{ steps.version_calc.outputs.version }} --no-configuration-cache --no-daemon --stacktrace

      - name: Package Release APK
        id: package_apk
        run: |
          TAG="${{ steps.version_calc.outputs.tag }}"
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi

          RELEASE_APK="VoltSage-${TAG}.apk"
          cp "$APK_FILE" "$RELEASE_APK"
          echo "Packaged APK: $RELEASE_APK"
          echo "apk_file=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      # Tag is only created and pushed if the build and packaging succeed
      - name: Create and Push Git Tag
        run: |
          TAG="${{ steps.version_calc.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # Release is published with the generated APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_calc.outputs.tag }}
          name: Release ${{ steps.version_calc.outputs.tag }}
          files: ${{ steps.package_apk.outputs.apk_file }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
